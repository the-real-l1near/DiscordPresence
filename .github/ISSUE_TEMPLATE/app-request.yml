name: "App support request"
description: "Request support for a new desktop application"
title: "[App Request] "
labels:
  - "app-request"

body:
  - type: markdown
    attributes:
      value: |
        Thanks for requesting support for a new app.

        Please provide enough information for us to identify the Windows process,
        detect the project/workspace name, and prepare the Discord Rich Presence asset.

  - type: input
    id: app-name
    attributes:
      label: "Application name"
      description: "Official application name."
      placeholder: "Example: Visual Studio"
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: "Official website"
      description: "Link to the application's official website or repository."
      placeholder: "https://example.com"
    validations:
      required: false

  - type: input
    id: process-name
    attributes:
      label: "Windows process name"
      description: |
        The executable/process name shown in Task Manager.

        Do not include the full local path.

        Example:
        `devenv.exe` → enter `devenv`
      placeholder: "Example: devenv"
    validations:
      required: true

  - type: textarea
    id: window-titles
    attributes:
      label: "Example window titles"
      description: |
        Paste 2-5 real window titles from the application.

        Include examples from different projects/workspaces if possible.
      placeholder: |
        ProjectOne - Visual Studio
        ProjectTwo - Visual Studio
    validations:
      required: true

  - type: textarea
    id: project-detection
    attributes:
      label: "Project / workspace detection"
      description: |
        Explain which part of the window title represents the project/workspace name.

        If there is no useful project name, say so.
      placeholder: |
        The project name appears before " - Visual Studio".
    validations:
      required: true

  - type: input
    id: display-name
    attributes:
      label: "Preferred Discord display name"
      description: "Optional. Leave blank to use the official application name."
      placeholder: "Example: Visual Studio"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Icon / logo requirements

        If you provide an icon or logo source, please use an official source when possible.

        Preferred asset:

        - PNG
        - Square (1:1)
        - 512x512 or larger preferred
        - Transparent background preferred
        - Official application icon/logo
        - No screenshots
        - No unrelated fan-made artwork
        - Avoid extra text unless it is part of the official logo
        - Do not upscale a tiny source image just to meet the preferred resolution

        You do **not** need to prepare the final Discord asset yourself.

        An official source URL is enough. The maintainer can crop or resize the image before upload.

  - type: textarea
    id: icon-source
    attributes:
      label: "Official icon / logo source"
      description: |
        Provide a link to an official icon/logo source if available.

        Good sources include:

        - Official website
        - Official press kit
        - Official GitHub repository
        - Official product page

        If you attach an image, please mention where it came from.
      placeholder: |
        Example:
        https://example.com/press-kit

        or

        Official repository asset:
        https://github.com/...
    validations:
      required: false

  - type: input
    id: suggested-asset-key
    attributes:
      label: "Suggested Discord asset key"
      description: |
        Optional.

        Preferred format:
        lowercase, no spaces, short, descriptive, and stable across application versions.

        The maintainer may change this before release.
      placeholder: "Example: visualstudio"
    validations:
      required: false

  - type: dropdown
    id: tested
    attributes:
      label: "Can you test a development build?"
      description: "Let us know whether you can help verify support before release."
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Additional notes"
      description: "Anything else that may help with detection or Rich Presence behavior."
      placeholder: "Optional additional information."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Checklist"
      options:
        - label: "I checked existing issues and this application has not already been requested."
          required: true

        - label: "I provided the actual Windows process name and real window-title examples."
          required: true

        - label: "Any icon/logo source I provided is official or clearly identified."
          required: false
