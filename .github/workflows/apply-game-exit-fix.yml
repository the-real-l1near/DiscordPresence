name: Apply game exit presence fix

on:
  push:
    branches:
      - fix/restore-presence-after-game-exit
    paths:
      - .github/workflows/apply-game-exit-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-presence-after-game-exit
          fetch-depth: 0

      - name: Patch PresenceController
        shell: python
        run: |
          from pathlib import Path

          path = Path("PresenceController.cs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  """    private bool\n        _isGameOverrideActive;\n""",
                  """    private bool\n        _isGameOverrideActive;\n\n    private string?\n        _activeGameProcessName;\n"""
              ),
              (
                  """        _discordPresence.RunCallbacks();\n\n        HandleGameDetection();\n""",
                  """        _discordPresence.RunCallbacks();\n\n        RestoreIfActiveGameExited();\n\n        HandleGameDetection();\n"""
              ),
              (
                  """        if (_isGameOverrideActive)\n        {\n            return;\n        }\n\n        _isGameOverrideActive =\n            true;\n\n        CancelPendingIdlePresence();\n""",
                  """        if (!string.IsNullOrWhiteSpace(\n            result.ProcessName\n        ))\n        {\n            _activeGameProcessName =\n                result.ProcessName;\n        }\n\n        if (_isGameOverrideActive)\n        {\n            return;\n        }\n\n        _isGameOverrideActive =\n            true;\n\n        CancelPendingIdlePresence();\n"""
              ),
              (
                  """    private void RestoreFromGameOverrideIfNeeded()\n    {\n        if (!_isGameOverrideActive)\n        {\n            return;\n        }\n\n        _isGameOverrideActive =\n            false;\n\n        var reinitialized =\n""",
                  """    private void RestoreIfActiveGameExited()\n    {\n        if (!_isGameOverrideActive)\n        {\n            return;\n        }\n\n        var processName =\n            _activeGameProcessName;\n\n        if (string.IsNullOrWhiteSpace(\n            processName\n        ))\n        {\n            return;\n        }\n\n        Process[] processes;\n\n        try\n        {\n            processes =\n                Process.GetProcessesByName(\n                    processName\n                );\n        }\n        catch\n        {\n            return;\n        }\n\n        try\n        {\n            if (processes.Length > 0)\n            {\n                return;\n            }\n        }\n        finally\n        {\n            foreach (var process in processes)\n            {\n                process.Dispose();\n            }\n        }\n\n        RestoreFromGameOverrideIfNeeded();\n    }\n\n    private void RestoreFromGameOverrideIfNeeded()\n    {\n        if (!_isGameOverrideActive)\n        {\n            return;\n        }\n\n        _isGameOverrideActive =\n            false;\n\n        _activeGameProcessName =\n            null;\n\n        var reinitialized =\n"""
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/apply-game-exit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PresenceController.cs .github/workflows/apply-game-exit-fix.yml
          git commit -m "fix: restore presence when active game exits"
          git push origin HEAD:fix/restore-presence-after-game-exit
