name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Setup .NET
      # -------------------------------------------------------

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # -------------------------------------------------------
      # Restore
      # -------------------------------------------------------

      - name: Restore
        run: dotnet restore .\DiscordPresence.csproj

      # -------------------------------------------------------
      # Build native Discord Social SDK bridge
      # -------------------------------------------------------

      - name: Build Discord Social SDK bridge
        shell: pwsh
        run: |
          cmake `
            -S .\native\DiscordSocialBridge `
            -B .\native\DiscordSocialBridge\build `
            -A x64

          if ($LASTEXITCODE -ne 0) {
              throw "CMake configure failed."
          }

          cmake --build `
            .\native\DiscordSocialBridge\build `
            --config Release

          if ($LASTEXITCODE -ne 0) {
              throw "Discord Social SDK bridge build failed."
          }

          $bridgePath =
              ".\native\DiscordSocialBridge\build\Release\DiscordSocialBridge.dll"

          if (-not (Test-Path $bridgePath)) {
              throw "DiscordSocialBridge.dll was not generated."
          }

      # -------------------------------------------------------
      # Build C# app
      # -------------------------------------------------------

      - name: Build Release
        run: >
          dotnet build
          .\DiscordPresence.csproj
          -c Release
          --no-restore

      # -------------------------------------------------------
      # Publish smoke test
      # -------------------------------------------------------

      - name: Publish framework-dependent smoke test
        run: >
          dotnet publish
          .\DiscordPresence.csproj
          -c Release
          -r win-x64
          --self-contained false
          --no-restore

      # -------------------------------------------------------
      # Validate native runtime files
      # -------------------------------------------------------

      - name: Validate publish output
        shell: pwsh
        run: |
          $publishDir =
              ".\bin\Release\net10.0-windows\win-x64\publish"

          $requiredFiles =
              @(
                  "DiscordPresence.exe"
                  "DiscordSocialBridge.dll"
                  "discord_partner_sdk.dll"
              )

          foreach ($file in $requiredFiles) {
              $path =
                  Join-Path $publishDir $file

              if (-not (Test-Path $path)) {
                  throw "Missing publish file: $file"
              }
          }

          $forbiddenRuntimeFiles =
              @(
                  "hostfxr.dll"
                  "hostpolicy.dll"
                  "coreclr.dll"
                  "SkiaSharp.dll"
                  "Svg.Skia.dll"
              )

          foreach ($file in $forbiddenRuntimeFiles) {
              $path =
                  Join-Path $publishDir $file

              if (Test-Path $path) {
                  throw "Unexpected runtime dependency in framework-dependent publish: $file"
              }
          }

          Write-Host "Framework-dependent publish output validated successfully."
