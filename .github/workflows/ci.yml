name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\DiscordPresence.csproj

      - name: Build Release
        run: dotnet build .\DiscordPresence.csproj -c Release --no-restore

      - name: Publish smoke test
        run: dotnet publish .\DiscordPresence.csproj -c Release -r win-x64 --self-contained true --no-restore
